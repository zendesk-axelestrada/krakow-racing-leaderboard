<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tire rubber -->
  <circle cx="128" cy="128" r="118" fill="#17171b"/>

  <!-- Red soft-compound band (the iconic Pirelli soft marker) -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#e1261c" stroke-width="20"/>

  <!-- Inner tire face -->
  <circle cx="128" cy="128" r="82" fill="#202027"/>

  <!-- Tread grooves -->
  <g stroke="#000000" stroke-width="7" opacity="0.55">
    <circle cx="128" cy="128" r="70" fill="none"/>
    <circle cx="128" cy="128" r="52" fill="none"/>
  </g>

  <!-- Hub opening -->
  <circle cx="128" cy="128" r="34" fill="#101013"/>
</svg>
